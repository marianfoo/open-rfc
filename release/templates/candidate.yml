name: Immutable candidate
run-name: Candidate ${{ inputs.candidate_kind }} ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_kind:
        description: Initial one-commit bootstrap or a merged Release Please candidate
        required: true
        type: choice
        options:
          - initial-bootstrap
          - release-please
      candidate_sha:
        description: Exact candidate commit (40 lowercase hex)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-${{ inputs.candidate_kind }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  OPEN_RFC_NPM_CLI_VERSION: 11.19.0

jobs:
  candidate:
    if: >-
      ${{ github.repository == 'marianfoo/open-rfc' &&
          github.ref == 'refs/heads/main' }}
    name: Linux immutable candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate candidate input and capture hosted runner identity
        env:
          CANDIDATE_KIND: ${{ inputs.candidate_kind }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          if [[ "$CANDIDATE_KIND" != "initial-bootstrap" &&
                "$CANDIDATE_KIND" != "release-please" ]]; then
            echo "candidate_kind must be initial-bootstrap or release-please." >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          fi
          printf 'OPEN_RFC_RUNNER_ENVIRONMENT=github-hosted\n' >> "$GITHUB_ENV"
          printf 'OPEN_RFC_IMAGE_OS=%s\n' "$ImageOS" >> "$GITHUB_ENV"
          printf 'OPEN_RFC_IMAGE_VERSION=%s\n' "$ImageVersion" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the immutable candidate is still staging main
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ]]; then
            echo "Checked-out commit differs from candidate_sha." >&2
            exit 1
          fi
          if [[ "$(git ls-remote origin refs/heads/main | awk '{print $1}')" != "$CANDIDATE_SHA" ]]; then
            echo "Candidate is no longer the sanitized staging main head." >&2
            exit 1
          fi
      - name: Verify the selected candidate lineage
        env:
          CANDIDATE_KIND: ${{ inputs.candidate_kind }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CANDIDATE_KIND" != "initial-bootstrap" ]]; then
            exit 0
          fi
          if [[ "$(git rev-list --count HEAD)" != "1" ]] ||
             git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "The initial bootstrap candidate must be the only commit in public history." >&2
            exit 1
          fi
          remote_heads="$(git ls-remote --heads origin)"
          if [[ "$(awk 'NF { count += 1 } END { print count + 0 }' <<<"$remote_heads")" != "1" ||
                "$remote_heads" != "$(git rev-parse HEAD)"$'\trefs/heads/main' ]]; then
            echo "The initial bootstrap repository must expose only the exact main branch." >&2
            exit 1
          fi
          author_name="$(git show -s --format=%an HEAD)"
          author_email="$(git show -s --format=%ae HEAD)"
          committer_name="$(git show -s --format=%cn HEAD)"
          committer_email="$(git show -s --format=%ce HEAD)"
          if [[ "$author_name" != "marianfoo" ||
                "$author_email" != "13335743+marianfoo@users.noreply.github.com" ||
                "$committer_name" != "$author_name" ||
                "$committer_email" != "$author_email" ]]; then
            echo "The initial bootstrap commit must use the approved author and committer identity." >&2
            exit 1
          fi
          if ! git log -1 --format=%B HEAD | \
            grep -Fx 'Signed-off-by: marianfoo <13335743+marianfoo@users.noreply.github.com>' >/dev/null; then
            echo "The initial bootstrap commit must carry the exact approved DCO sign-off." >&2
            exit 1
          fi
          # The bootstrap import is unsigned because it is pushed before any pull
          # request exists. Signature verification applies to GitHub-created merge
          # commits after bootstrap.
          version="$(node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const lockfile = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const releaseManifest = JSON.parse(readFileSync(".release-please-manifest.json", "utf8"));
          const runtime = readFileSync("src/compat/node-rfc-client.ts", "utf8");
          const changelog = readFileSync("CHANGELOG.md", "utf8");
          const version = "0.2.0";
          const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/gu, "\\$&");
          const changelogHeading = new RegExp(`^## \\[${escapedVersion}\\](?:\\(|\\s|$)`, "mu");
          const runtimeMarker = `OPEN_RFC_PACKAGE_VERSION = ${JSON.stringify(version)}; // x-release-please-version`;
          if (manifest.version !== version || manifest.private !== false || manifest.license !== "Apache-2.0") process.exit(1);
          if (releaseManifest["."] !== version) process.exit(1);
          if (lockfile.version !== version || lockfile.packages?.[""]?.version !== version) process.exit(1);
          if (!runtime.includes(runtimeMarker) || !changelogHeading.test(changelog)) process.exit(1);
          process.stdout.write(version);
          NODE
          )" || {
            echo "Initial bootstrap metadata must consistently describe stable 0.2.0." >&2
            exit 1
          }
          if [[ -n "$(git ls-remote --tags origin)" ]]; then
            echo "The initial bootstrap repository must not contain any tags." >&2
            exit 1
          fi
          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1")"
          if [[ "$(jq 'length' <<<"$releases")" != "0" ]]; then
            echo "The initial bootstrap repository must not contain any GitHub Releases." >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install exact toolchain
        run: |
          npm run --silent ci:install-pinned-npm
          npm run --silent ci:record-npm-cli
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and independently verify one public candidate
        run: |
          install -d -m 700 "${{ runner.temp }}/open-rfc-release"
          node tools/release_artifact_gate.mjs \
            "${{ runner.temp }}/open-rfc-release/open-rfc-candidate" \
            --publication-mode public-license-preflight \
            --commit "${{ inputs.candidate_sha }}"
          node tools/verify_candidate_bundle.mjs \
            "${{ runner.temp }}/open-rfc-release/open-rfc-candidate" \
            --publication-mode public-license-preflight \
            --commit "${{ inputs.candidate_sha }}"
      - name: Verify the exact candidate on Node.js 24
        run: |
          node tools/public_hosted_platform_evidence.mjs cell \
            --artifact-directory "${{ runner.temp }}/open-rfc-release/open-rfc-candidate" \
            --output-directory "${{ runner.temp }}/open-rfc-release/platform-cells" \
            --publication-mode public-license-preflight \
            --commit "${{ inputs.candidate_sha }}" \
            --requested-node 24 \
            --runner-label ubuntu-24.04
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.14
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Prove the exact candidate documentation site
        env:
          OPEN_RFC_DOCS_PYTHON: ${{ runner.temp }}/open-rfc-docs-venv/bin/python
        run: |
          python -m venv "$RUNNER_TEMP/open-rfc-docs-venv"
          "$OPEN_RFC_DOCS_PYTHON" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-docs.txt
          "$OPEN_RFC_DOCS_PYTHON" -m pip check
          node tools/hosted_documentation_evidence.mjs \
            --artifact-directory "${{ runner.temp }}/open-rfc-release/open-rfc-candidate" \
            --output-directory "${{ runner.temp }}/open-rfc-release/documentation-evidence" \
            --publication-mode public-license-preflight \
            --commit "${{ inputs.candidate_sha }}" \
            --runner-label ubuntu-24.04
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install the Node.js 22 candidate toolchain
        run: |
          npm run --silent ci:install-pinned-npm
          npm run --silent ci:record-npm-cli
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the same candidate on Node.js 22 and aggregate evidence
        run: |
          node tools/public_hosted_platform_evidence.mjs cell \
            --artifact-directory "${{ runner.temp }}/open-rfc-release/open-rfc-candidate" \
            --output-directory "${{ runner.temp }}/open-rfc-release/platform-cells" \
            --publication-mode public-license-preflight \
            --commit "${{ inputs.candidate_sha }}" \
            --requested-node 22 \
            --runner-label ubuntu-24.04
          node tools/public_hosted_platform_evidence.mjs aggregate \
            --artifact-directory "${{ runner.temp }}/open-rfc-release/open-rfc-candidate" \
            --cells-directory "${{ runner.temp }}/open-rfc-release/platform-cells" \
            --output-directory "${{ runner.temp }}/open-rfc-release/platform-cells" \
            --publication-mode public-license-preflight \
            --commit "${{ inputs.candidate_sha }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-rfc-candidate
          path: ${{ runner.temp }}/open-rfc-release/open-rfc-candidate
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-rfc-hosted-documentation-evidence
          path: ${{ runner.temp }}/open-rfc-release/documentation-evidence
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-rfc-linux-node-evidence
          path: ${{ runner.temp }}/open-rfc-release/platform-cells
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
