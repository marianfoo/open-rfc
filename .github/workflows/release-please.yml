name: Release Please

# Every push to main is offered to Release Please. It either opens or updates a
# release pull request, or does nothing because no releasable commit has landed
# since the last release. Doing nothing is the normal case and is reported as a
# successful run.
#
# Merging that pull request is the whole release. Release Please bumps the
# version, writes the changelog, tags the commit and creates the GitHub release;
# creating the release is what triggers npm-publish.yml.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    # Forks inherit workflows. Without this a fork would try to release from its
    # own main, against this repository's manifest.
    if: ${{ github.repository == 'marianfoo/open-rfc' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The release pull request is opened with GITHUB_TOKEN, and GitHub does
      # not let a GITHUB_TOKEN event start another workflow run. So this one
      # pull request arrives with NO CI run of its own, and a required status
      # check on main would leave it permanently unmergeable rather than merely
      # unverified.
      #
      # Read it before merging. Release Please rewrites the version in
      # package.json, package-lock.json, .release-please-manifest.json,
      # CHANGELOG.md, and src/compat/node-rfc-client.ts — that last one is a
      # shipped source file, so the change does reach the published package.
      # The contents are machine-generated from commits that were themselves
      # verified, which is what makes an unchecked merge acceptable here.
      #
      # A GitHub App or PAT in RELEASE_PLEASE_TOKEN would restore CI on this
      # pull request. That is the only thing it buys.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
