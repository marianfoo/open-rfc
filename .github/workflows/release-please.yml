name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_kind:
        description: Initial one-commit bootstrap or a merged Release Please candidate
        required: true
        type: choice
        options:
          - initial-bootstrap
          - release-please
      candidate_sha:
        description: Exact verified candidate commit (40 lowercase hex)
        required: true
        type: string
      tarball_sha256:
        description: SHA-256 of the verified open-rfc tarball (64 lowercase hex)
        required: true
        type: string
      recover_existing_draft:
        description: Resume only an existing candidate tag after draft or attachment failure
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  prepare-release-pr:
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'marianfoo/open-rfc' &&
          vars.OPEN_RFC_RELEASE_PLEASE_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The release pull request is opened with GITHUB_TOKEN, and GitHub does
      # not let a GITHUB_TOKEN event start another workflow run. So this one
      # pull request arrives with NO CI run of its own, and a required status
      # check would leave it permanently unmergeable rather than merely
      # unverified.
      #
      # Read it before merging. Release Please rewrites the version in
      # package.json, package-lock.json, .release-please-manifest.json,
      # CHANGELOG.md, and src/compat/node-rfc-client.ts — that last one is a
      # shipped source file, so the change does reach the published package.
      # The contents are machine-generated from commits that were themselves
      # verified, which is what makes an unchecked merge acceptable here.
      #
      # A GitHub App or PAT in RELEASE_PLEASE_TOKEN would restore CI on this
      # pull request. That is the only thing it buys.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: "true"

  create-draft-release:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'marianfoo/open-rfc' &&
          github.event.repository.visibility == 'public' &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Validate immutable release inputs
        env:
          CANDIDATE_KIND: ${{ inputs.candidate_kind }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TARBALL_SHA256: ${{ inputs.tarball_sha256 }}
          RECOVER_EXISTING_DRAFT: ${{ inputs.recover_existing_draft }}
        shell: bash
        run: |
          if [[ "$CANDIDATE_KIND" != "initial-bootstrap" &&
                "$CANDIDATE_KIND" != "release-please" ]]; then
            echo "candidate_kind must be initial-bootstrap or release-please." >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          fi
          if [[ ! "$TARBALL_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "tarball_sha256 must be exactly 64 lowercase hexadecimal characters." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install the exact verification toolchain
        run: |
          npm run --silent ci:install-pinned-npm
          npm run --silent ci:record-npm-cli
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify candidate lineage and hosted artifact
        id: preflight
        env:
          CANDIDATE_KIND: ${{ inputs.candidate_kind }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TARBALL_SHA256: ${{ inputs.tarball_sha256 }}
          RECOVER_EXISTING_DRAFT: ${{ inputs.recover_existing_draft }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ]]; then
            echo "Checked-out commit differs from candidate_sha." >&2
            exit 1
          fi
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$remote_main" != "$CANDIDATE_SHA" ]]; then
            echo "The verified candidate is no longer the public main head." >&2
            exit 1
          fi

          version="$(node --input-type=module - "$CANDIDATE_KIND" <<'NODE'
          import { readFileSync } from "node:fs";
          const [candidateKind] = process.argv.slice(2);
          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const lockfile = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const releaseManifest = JSON.parse(readFileSync(".release-please-manifest.json", "utf8"));
          const runtime = readFileSync("src/compat/node-rfc-client.ts", "utf8");
          const changelog = readFileSync("CHANGELOG.md", "utf8");
          if (manifest.private !== false || manifest.license !== "Apache-2.0") process.exit(1);
          if (!/^0\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/u.test(manifest.version)) process.exit(1);
          if (releaseManifest["."] !== manifest.version) process.exit(1);
          if (lockfile.version !== manifest.version || lockfile.packages?.[""]?.version !== manifest.version) process.exit(1);
          const escapedVersion = manifest.version.replace(/[.*+?^${}()|[\]\\]/gu, "\\$&");
          const changelogHeading = new RegExp(`^## \\[${escapedVersion}\\](?:\\(|\\s|$)`, "mu");
          const runtimeMarker = `OPEN_RFC_PACKAGE_VERSION = ${JSON.stringify(manifest.version)}; // x-release-please-version`;
          if (!runtime.includes(runtimeMarker) || !changelogHeading.test(changelog)) process.exit(1);
          if (candidateKind === "initial-bootstrap" && manifest.version !== "0.2.0") process.exit(1);
          process.stdout.write(manifest.version);
          NODE
          )"
          expected_tag="v${version}"
          tag_present=false
          release_present=false
          if expected_tag_ref="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${expected_tag}" 2>/dev/null)"; then
            tag_present=true
            if [[ "$(jq -r '.object.type' <<<"$expected_tag_ref")" != "commit" ||
                  "$(jq -r '.object.sha' <<<"$expected_tag_ref")" != "$CANDIDATE_SHA" ]]; then
              echo "Existing release tag is not the exact lightweight candidate tag." >&2
              exit 1
            fi
          fi
          if expected_release="$(gh release view "$expected_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,tagName 2>/dev/null)"; then
            release_present=true
            if [[ "$(jq -r '.isDraft' <<<"$expected_release")" != "true" ||
                  "$(jq -r '.tagName' <<<"$expected_release")" != "$expected_tag" ]]; then
              echo "Existing release is not the exact candidate-bound draft." >&2
              exit 1
            fi
          fi

          release_pr_number=""
          if [[ "$CANDIDATE_KIND" == "initial-bootstrap" ]]; then
            if [[ "$(git rev-list --count HEAD)" != "1" ]] ||
               git rev-parse HEAD^ >/dev/null 2>&1; then
              echo "The initial bootstrap candidate must be the only commit in public history." >&2
              exit 1
            fi
            remote_heads="$(git ls-remote --heads origin)"
            if [[ "$(awk 'NF { count += 1 } END { print count + 0 }' <<<"$remote_heads")" != "1" ||
                  "$remote_heads" != "$CANDIDATE_SHA"$'\trefs/heads/main' ]]; then
              echo "The initial bootstrap repository must expose only the exact main branch." >&2
              exit 1
            fi
            if [[ "$RECOVER_EXISTING_DRAFT" == "true" ]]; then
              if [[ "$tag_present" != "true" ]]; then
                echo "Bootstrap recovery requires the exact candidate tag." >&2
                exit 1
              fi
              remote_tags="$(git ls-remote --tags origin)"
              expected_remote_tag=""
              if [[ "$tag_present" == "true" ]]; then
                expected_remote_tag="$CANDIDATE_SHA"$'\t'"refs/tags/${expected_tag}"
              fi
              if [[ "$remote_tags" != "$expected_remote_tag" ]]; then
                echo "Bootstrap recovery found an unexpected public tag." >&2
                exit 1
              fi
              bootstrap_releases="$(gh api \
                "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
              expected_release_count=0
              if [[ "$release_present" == "true" ]]; then
                expected_release_count=1
              fi
              if [[ "$(jq 'length' <<<"$bootstrap_releases")" != "$expected_release_count" ]]; then
                echo "Bootstrap recovery found an unexpected GitHub Release." >&2
                exit 1
              fi
            else
              if [[ -n "$(git ls-remote --tags origin)" ]]; then
                echo "Initial bootstrap repository already contains a tag; refusing a replay." >&2
                exit 1
              fi
              bootstrap_releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1")"
              if [[ "$(jq 'length' <<<"$bootstrap_releases")" != "0" ]]; then
                echo "Initial bootstrap repository already contains a GitHub Release; refusing a replay." >&2
                exit 1
              fi
            fi
          else
            pulls="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/pulls")"
            release_pr_count="$(jq --arg sha "$CANDIDATE_SHA" '[.[] | select(
              .merged_at != null and
              .merge_commit_sha == $sha and
              .base.ref == "main" and
              (.head.ref | startswith("release-please--branches--main")) and
              any(.labels[]?; .name == "autorelease: pending")
            )] | length' <<<"$pulls")"
            if [[ "$RECOVER_EXISTING_DRAFT" == "true" ]]; then
              recovery_release_pr_count="$(jq --arg sha "$CANDIDATE_SHA" '[.[] | select(
                .merged_at != null and
                .merge_commit_sha == $sha and
                .base.ref == "main" and
                (.head.ref | startswith("release-please--branches--main")) and
                any(.labels[]?; .name == "autorelease: pending" or .name == "autorelease: tagged")
              )] | length' <<<"$pulls")"
              if [[ "$recovery_release_pr_count" != "1" ]]; then
                echo "Draft recovery requires the unique merged candidate Release Please PR." >&2
                exit 1
              fi
              release_pr_number="$(jq -r --arg sha "$CANDIDATE_SHA" '.[] | select(
                .merged_at != null and
                .merge_commit_sha == $sha and
                .base.ref == "main" and
                (.head.ref | startswith("release-please--branches--main")) and
                any(.labels[]?; .name == "autorelease: pending" or .name == "autorelease: tagged")
              ) | .number' <<<"$pulls")"
              if [[ "$tag_present" != "true" ]]; then
                echo "Draft recovery requires the exact candidate tag." >&2
                exit 1
              fi
            else
              if [[ "$release_pr_count" != "1" ]]; then
                echo "Candidate must be the unique merged pending Release Please PR." >&2
                exit 1
              fi
              release_pr_number="$(jq -r --arg sha "$CANDIDATE_SHA" '.[] | select(
                .merged_at != null and
                .merge_commit_sha == $sha and
                .base.ref == "main" and
                (.head.ref | startswith("release-please--branches--main")) and
                any(.labels[]?; .name == "autorelease: pending")
              ) | .number' <<<"$pulls")"
              if [[ "$tag_present" == "true" ]]; then
                echo "Expected release tag already exists; refusing a replay." >&2
                exit 1
              fi
              if [[ "$release_present" == "true" ]]; then
                echo "Expected GitHub Release already exists; refusing a replay." >&2
                exit 1
              fi
            fi
          fi

          runs="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/candidate.yml/runs" \
            -f event=workflow_dispatch \
            -f status=success \
            -f head_sha="$CANDIDATE_SHA" \
            -f per_page=100)"
          expected_run_title="Candidate ${CANDIDATE_KIND} ${CANDIDATE_SHA}"
          run_id="$(jq -r --arg sha "$CANDIDATE_SHA" --arg title "$expected_run_title" '[.workflow_runs[] | select(
            .head_sha == $sha and
            .conclusion == "success" and
            .display_title == $title and
            .path == ".github/workflows/candidate.yml"
          )] | sort_by(.run_number) | last | .id // empty' <<<"$runs")"
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "No successful immutable-candidate workflow exists for candidate_sha." >&2
            exit 1
          fi

          artifact_directory="${RUNNER_TEMP}/open-rfc-verified-candidate"
          install -d -m 700 "$artifact_directory"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name open-rfc-candidate \
            --dir "$artifact_directory"
          if [[ "$tag_present" == "true" ]]; then
            tag_ref="refs/tags/${expected_tag}"
            git fetch --force --no-tags origin \
              "+${tag_ref}:${tag_ref}"
            if [[ "$(git cat-file -t "$tag_ref")" != "commit" ||
                  "$(git rev-parse --verify "$tag_ref")" != "$CANDIDATE_SHA" ]]; then
              echo "Fetched recovery tag is not the exact lightweight candidate tag." >&2
              exit 1
            fi
            node tools/verify_candidate_bundle.mjs "$artifact_directory" \
              --publication-mode public-license-preflight \
              --commit "$CANDIDATE_SHA" \
              --post-release-tag "$expected_tag"
          else
            if git show-ref --verify --quiet "refs/tags/${expected_tag}"; then
              echo "An unexpected local release tag exists without a matching remote tag." >&2
              exit 1
            fi
            node tools/verify_candidate_bundle.mjs "$artifact_directory" \
              --publication-mode public-license-preflight \
              --commit "$CANDIDATE_SHA"
          fi
          node --input-type=module - "$artifact_directory" "$CANDIDATE_SHA" "$TARBALL_SHA256" "$version" <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";
          const [directory, commit, expectedSha256, version] = process.argv.slice(2);
          const gate = JSON.parse(readFileSync(join(directory, "release-artifact-gate.v1.json"), "utf8"));
          const tarballs = readdirSync(directory).filter((name) => name.endsWith(".tgz"));
          if (tarballs.length !== 1 || tarballs[0] !== `open-rfc-${version}.tgz`) process.exit(1);
          const actualSha256 = createHash("sha256")
            .update(readFileSync(join(directory, tarballs[0])))
            .digest("hex");
          if (actualSha256 !== expectedSha256) process.exit(1);
          if (gate.commit !== commit || gate.artifact?.sha256 !== expectedSha256) process.exit(1);
          if (gate.artifact?.filename !== tarballs[0]) process.exit(1);
          NODE

          {
            echo "version=$version"
            echo "expected_tag=$expected_tag"
            echo "artifact_directory=$artifact_directory"
            echo "release_pr_number=$release_pr_number"
          } >> "$GITHUB_OUTPUT"
      - name: Ensure the candidate-bound tag and draft GitHub Release
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_TAG: ${{ steps.preflight.outputs.expected_tag }}
          RECOVER_EXISTING_DRAFT: ${{ inputs.recover_existing_draft }}
          VERSION: ${{ steps.preflight.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git ls-remote origin refs/heads/main | awk '{print $1}')" != "$CANDIDATE_SHA" ]]; then
            echo "The verified candidate stopped being public main after preflight." >&2
            exit 1
          fi

          notes_file="${RUNNER_TEMP}/open-rfc-release-notes.md"
          node --input-type=module - "$VERSION" "$notes_file" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const [version, output] = process.argv.slice(2);
          const lines = readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/u);
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/gu, "\\$&");
          const heading = new RegExp(`^## \\[${escaped}\\](?:\\(|\\s|$)`, "u");
          const start = lines.findIndex((line) => heading.test(line));
          const end = start < 0
            ? -1
            : lines.findIndex((line, index) => index > start && /^## /u.test(line));
          const body = start < 0 ? "" : lines.slice(start + 1, end < 0 ? lines.length : end).join("\n").trim();
          if (body.length === 0 || Buffer.byteLength(body, "utf8") > 128 * 1024) process.exit(1);
          writeFileSync(output, `${body}\n`, { flag: "wx", mode: 0o600 });
          NODE
          expected_release_body="$(cat "$notes_file")"

          tag_present=false
          release_present=false
          if tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${EXPECTED_TAG}" 2>/dev/null)"; then
            tag_present=true
            if [[ "$(jq -r '.object.type' <<<"$tag_ref")" != "commit" ||
                  "$(jq -r '.object.sha' <<<"$tag_ref")" != "$CANDIDATE_SHA" ]]; then
              echo "Existing recovery tag is not the exact lightweight candidate tag." >&2
              exit 1
            fi
          fi
          if existing_release="$(gh release view "$EXPECTED_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body,isDraft,isPrerelease,name,tagName 2>/dev/null)"; then
            release_present=true
            if [[ "$(jq -r '.isDraft' <<<"$existing_release")" != "true" ||
                  "$(jq -r '.isPrerelease' <<<"$existing_release")" != "false" ||
                  "$(jq -r '.tagName' <<<"$existing_release")" != "$EXPECTED_TAG" ||
                  "$(jq -r '.name' <<<"$existing_release")" != "$EXPECTED_TAG" ||
                  "$(jq -r '.body' <<<"$existing_release")" != "$expected_release_body" ]]; then
              echo "Existing release is not the requested exact draft recovery target." >&2
              exit 1
            fi
          fi
          if [[ "$RECOVER_EXISTING_DRAFT" == "true" ]]; then
            if [[ "$tag_present" != "true" ]]; then
              echo "Recovery requires the exact candidate tag created by the first attempt." >&2
              exit 1
            fi
          elif [[ "$tag_present" == "true" || "$release_present" == "true" ]]; then
            echo "Candidate release state appeared after preflight; refusing an unrequested recovery." >&2
            exit 1
          fi

          if [[ "$tag_present" != "true" ]]; then
            tag_payload="$(jq -cn \
              --arg ref "refs/tags/${EXPECTED_TAG}" \
              --arg sha "$CANDIDATE_SHA" \
              '{ref: $ref, sha: $sha}')"
            tag_ref="$(gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              --input - <<<"$tag_payload")"
            if [[ "$(jq -r '.ref' <<<"$tag_ref")" != "refs/tags/${EXPECTED_TAG}" ||
                  "$(jq -r '.object.type' <<<"$tag_ref")" != "commit" ||
                  "$(jq -r '.object.sha' <<<"$tag_ref")" != "$CANDIDATE_SHA" ]]; then
              echo "Created release tag is not the exact lightweight candidate tag." >&2
              exit 1
            fi
          fi

          if [[ "$release_present" != "true" ]]; then
            release_payload="$(jq -cn \
              --arg tag "$EXPECTED_TAG" \
              --arg sha "$CANDIDATE_SHA" \
              --arg name "$EXPECTED_TAG" \
              --rawfile body "$notes_file" \
              '{tag_name: $tag, target_commitish: $sha, name: $name, body: $body,
                draft: true, prerelease: false, generate_release_notes: false}')"
            created_release="$(gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/releases" \
              --input - <<<"$release_payload")"
            if [[ "$(jq -r '.draft' <<<"$created_release")" != "true" ||
                  "$(jq -r '.tag_name' <<<"$created_release")" != "$EXPECTED_TAG" ]]; then
              echo "Created draft release is not bound to the exact candidate tag." >&2
              exit 1
            fi
          fi
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${EXPECTED_TAG}")"
          if [[ "$(jq -r '.object.type' <<<"$tag_ref")" != "commit" ||
                "$(jq -r '.object.sha' <<<"$tag_ref")" != "$CANDIDATE_SHA" ]]; then
            echo "Release tag stopped matching the exact lightweight candidate tag." >&2
            exit 1
          fi
          release="$(gh release view "$EXPECTED_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body,isDraft,isPrerelease,name,tagName)"
          if [[ "$(jq -r '.isDraft' <<<"$release")" != "true" ||
                "$(jq -r '.isPrerelease' <<<"$release")" != "false" ||
                "$(jq -r '.tagName' <<<"$release")" != "$EXPECTED_TAG" ||
                "$(jq -r '.name' <<<"$release")" != "$EXPECTED_TAG" ||
                "$(jq -r '.body' <<<"$release")" != "$expected_release_body" ]]; then
            echo "Candidate-bound draft release is missing after creation or recovery." >&2
            exit 1
          fi
      - name: Attach and reverify the exact verified release set
        env:
          CANDIDATE_KIND: ${{ inputs.candidate_kind }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TARBALL_SHA256: ${{ inputs.tarball_sha256 }}
          EXPECTED_TAG: ${{ steps.preflight.outputs.expected_tag }}
          EXPECTED_TARBALL: open-rfc-${{ steps.preflight.outputs.version }}.tgz
          ARTIFACT_DIRECTORY: ${{ steps.preflight.outputs.artifact_directory }}
          RELEASE_PR_NUMBER: ${{ steps.preflight.outputs.release_pr_number }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh release view "$EXPECTED_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,tagName)"
          if [[ "$(jq -r '.isDraft' <<<"$release")" != "true" ||
                "$(jq -r '.tagName' <<<"$release")" != "$EXPECTED_TAG" ]]; then
            echo "The candidate-bound release step did not create the expected draft." >&2
            exit 1
          fi

          if [[ "$CANDIDATE_KIND" == "release-please" ]]; then
            release_pr_labels="$(gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${RELEASE_PR_NUMBER}" \
              --jq '[.labels[].name]')"
            if ! jq -e 'index("autorelease: tagged") != null' <<<"$release_pr_labels" >/dev/null; then
              jq -cn '{labels: ["autorelease: tagged"]}' | gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/issues/${RELEASE_PR_NUMBER}/labels" \
                --input - >/dev/null
            fi
            if jq -e 'index("autorelease: pending") != null' <<<"$release_pr_labels" >/dev/null; then
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/issues/${RELEASE_PR_NUMBER}/labels/autorelease%3A%20pending" \
                >/dev/null
            fi
          fi

          gh release upload "$EXPECTED_TAG" \
            "$ARTIFACT_DIRECTORY/$EXPECTED_TARBALL" \
            "$ARTIFACT_DIRECTORY/release-artifact-gate.v1.json" \
            "$ARTIFACT_DIRECTORY/sbom.spdx.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          expected_assets="$(jq -cn --arg tarball "$EXPECTED_TARBALL" \
            '[ $tarball, "release-artifact-gate.v1.json", "sbom.spdx.json" ] | sort')"
          actual_assets="$(gh release view "$EXPECTED_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '[.assets[].name] | sort')"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Draft release assets differ from the exact verified release set." >&2
            exit 1
          fi
          download_directory="${RUNNER_TEMP}/open-rfc-release-download"
          install -d -m 700 "$download_directory"
          gh release download "$EXPECTED_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'open-rfc-*.tgz' \
            --pattern 'release-artifact-gate.v1.json' \
            --pattern 'sbom.spdx.json' \
            --dir "$download_directory"
          git fetch --force origin \
            "refs/tags/${EXPECTED_TAG}:refs/tags/${EXPECTED_TAG}"
          node tools/verify_candidate_bundle.mjs "$download_directory" \
            --publication-mode public-license-preflight \
            --commit "$CANDIDATE_SHA" \
            --post-release-tag "$EXPECTED_TAG"
          if [[ "$(sha256sum "$download_directory/$EXPECTED_TARBALL" | awk '{print $1}')" != "$TARBALL_SHA256" ]]; then
            echo "Downloaded draft tarball differs from the verified tarball." >&2
            exit 1
          fi
